<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <style>
      .text-logo {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 280px;
        text-anchor: middle;
        letter-spacing: -6px;
      }
      .letter-t {
        fill: #ffffff;
      }
      .period {
        fill: rgba(255, 255, 255, 0.25);
      }
    </style>
  </defs>
  
  <!-- Premium Dark App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle glassmorphic inner border to match portfolio aesthetic -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8" />

  <!-- Monogram 'T.' -->
  <text x="256" y="356" class="text-logo">
    <tspan class="letter-t">T</tspan><tspan class="period">.</tspan>
  </text>
</svg>
