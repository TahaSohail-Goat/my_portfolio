name: Rename Vercel Project

on:
  workflow_dispatch:
    inputs:
      project_search:
        description: 'Project name to search (default: my-portfolio)'
        required: false
        default: 'my-portfolio'
      new_name:
        description: 'New project name (lowercase recommended)'
        required: true
        default: 'tahasohail'

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename Vercel project via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SEARCH_NAME: ${{ github.event.inputs.project_search }}
          NEW_NAME: ${{ github.event.inputs.new_name }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then echo "Missing VERCEL_TOKEN secret"; exit 1; fi
          echo "Listing projects..."
          projects_json=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/projects")
          project_id=$(echo "$projects_json" | jq -r --arg name "$SEARCH_NAME" '.projects[] | select(.name==$name) | .id' | head -n1)
          if [ -z "$project_id" ] || [ "$project_id" = "null" ]; then
            echo "Project with name $SEARCH_NAME not found. Exiting."
            echo "Available projects:"
            echo "$projects_json" | jq -r '.projects[] | "- \(.name) (\(.id))"'
            exit 1
          fi
          echo "Found project id: $project_id"
          echo "Renaming to $NEW_NAME..."
          resp=$(curl -s -X PATCH "https://api.vercel.com/v1/projects/$project_id" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$NEW_NAME\"}")
          echo "Response: $resp"
          echo "Done."
