packages:
  "framer-motion": "For page transitions, scroll animations, and interactive UI elements"
  "three": "Core 3D library required for React Three Fiber"
  "@react-three/fiber": "React renderer for Three.js to build the 3D background and hero photo"
  "@react-three/drei": "Useful helpers for React Three Fiber (Float, Environment, etc.)"
  "lucide-react": "For UI icons"

images:
  - path: "artifacts/portfolio/public/images/project-1-bg.png"
    description: "Abstract dark futuristic 3D network graph with glowing cyan nodes and paths, conveying navigation and algorithms"
    aspect_ratio: "16:9"
  - path: "artifacts/portfolio/public/images/project-2-bg.png"
    description: "Abstract magical glowing purple and magenta 3D orbs and particles floating in a dark void, conveying fantasy and encapsulation"
    aspect_ratio: "16:9"
  - path: "artifacts/portfolio/public/images/project-3-bg.png"
    description: "Futuristic neon glowing 3D geometric grid with abstract X and O shapes hovering, cyberpunk aesthetic"
    aspect_ratio: "16:9"

notes:
  - The user's photo is at /taha-photo.jpeg
  - This is a static frontend-only portfolio, no backend required.
  - Wouter is used for smooth scroll routing emulation if needed, but primarily it's a single-page scrolling site.
